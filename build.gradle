plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'dev.localcape'
base { archivesName = 'localcape' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Only fabric-key-binding-api + lifecycle/events are used.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // No Flashback dependency: the mixin hooks vanilla's AvatarRenderer, which Flashback's
    // replayed players also go through.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
